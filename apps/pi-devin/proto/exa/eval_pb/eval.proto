    RESULT_TYPE_UNKNOWN = 0;
    RESULT_TYPE_TEST_PASS = 1;
    RESULT_TYPE_TEST_FAIL = 2;
    RESULT_TYPE_COMPILE_ERROR = 3;
    RESULT_TYPE_RUNTIME_ERROR = 4;
  }

}

