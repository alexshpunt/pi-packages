syntax = "proto3";

package exa.auth_pb;

import "buf/validate/validate.proto";
import "exa/codeium_common_pb/codeium_common.proto";

option go_package = "github.com/Exafunction/Exafunction/exa/auth_pb";

message GetUserJwtRequest {
  .exa.codeium_common_pb.Metadata metadata = 1 [(buf.validate.field) = { required: true }];
}

message GetUserJwtResponse {
  string user_jwt = 1;
  string custom_api_server_url = 2;
}

service AuthService {
  rpc GetUserJwt(GetUserJwtRequest) returns (GetUserJwtResponse);
}
