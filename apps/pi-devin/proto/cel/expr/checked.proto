syntax = "proto3";

package cel.expr;

import "cel/expr/syntax.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option java_package = "dev.cel.expr";
option java_outer_classname = "DeclProto";
option java_multiple_files = true;
option go_package = "cel.dev/expr";
option cc_enable_arenas = true;

message CheckedExpr {
  map<int64, Reference> reference_map = 2;
  map<int64, Type> type_map = 3;
  SourceInfo source_info = 5;
  string expr_version = 6;
  Expr expr = 4;
}

message Type {
  oneof type_kind {
    .google.protobuf.Empty dyn = 1;
    .google.protobuf.NullValue null = 2;
    Type.PrimitiveType primitive = 3;
    Type.PrimitiveType wrapper = 4;
    Type.WellKnownType well_known = 5;
    Type.ListType list_type = 6;
    Type.MapType map_type = 7;
    Type.FunctionType function = 8;
    string message_type = 9;
    string type_param = 10;
    Type type = 11;
    .google.protobuf.Empty error = 12;
    Type.AbstractType abstract_type = 14;
  }
  enum PrimitiveType {
    PRIMITIVE_TYPE_UNSPECIFIED = 0;
    BOOL = 1;
    INT64 = 2;
    UINT64 = 3;
    DOUBLE = 4;
    STRING = 5;
    BYTES = 6;
  }

  enum WellKnownType {
    WELL_KNOWN_TYPE_UNSPECIFIED = 0;
    ANY = 1;
    TIMESTAMP = 2;
    DURATION = 3;
  }

  message ListType {
    Type elem_type = 1;
  }

  message MapType {
    Type key_type = 1;
    Type value_type = 2;
  }

  message FunctionType {
    Type result_type = 1;
    repeated Type arg_types = 2;
  }

  message AbstractType {
    string name = 1;
    repeated Type parameter_types = 2;
  }

}

message Decl {
  string name = 1;
  oneof decl_kind {
    Decl.IdentDecl ident = 2;
    Decl.FunctionDecl function = 3;
  }
  message IdentDecl {
    Type type = 1;
    Constant value = 2;
    string doc = 3;
  }

  message FunctionDecl {
    repeated Decl.FunctionDecl.Overload overloads = 1;
    string doc = 2;
    message Overload {
      string overload_id = 1;
      repeated Type params = 2;
      repeated string type_params = 3;
      Type result_type = 4;
      bool is_instance_function = 5;
      string doc = 6;
    }

  }

}

message Reference {
  string name = 1;
  repeated string overload_id = 3;
  Constant value = 4;
}
